<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAMPLE v1 · Today</title>
<script src="telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#16181d);--mu:var(--tg-theme-hint-color,#7a7f8a);
--ac:var(--tg-theme-button-color,#2f7de1);--act:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f3f6);
--ok:#2e9e5b;--warn:#c0392b;--amber:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:var(--tg-theme-bg-color,#17191d);--tx:var(--tg-theme-text-color,#eceef2);
--mu:var(--tg-theme-hint-color,#8b919c);--card:var(--tg-theme-secondary-bg-color,#22252b)}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:12px 16px 96px;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
h1{font-size:22px;margin:0}.tag{font-size:11px;color:var(--mu);border:1px solid var(--mu);border-radius:6px;padding:1px 6px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;padding:9px 4px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:15px}
.tabs button.on{background:var(--ac);color:var(--act);font-weight:600}
.big{font-size:21px;font-weight:650;margin:4px 0 6px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--act);font-size:16px;font-weight:600;margin-top:8px}
.btn.alt{background:var(--card);color:var(--tx);font-weight:500}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.en{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.en button{padding:10px 2px;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font-size:13px}
.stop{border-left:4px solid var(--warn);padding:8px 10px;font-size:13px;background:var(--card);border-radius:8px;margin-top:12px}
.warn{border-left:4px solid var(--amber);padding:8px 10px;font-size:14px;margin-top:10px;background:var(--bg);border-radius:8px}
.cue{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.step{font-size:13px;color:var(--mu)}.timer{font-size:40px;font-weight:700;text-align:center;margin:10px 0 2px;font-variant-numeric:tabular-nums}
details{background:var(--card);border-radius:14px;margin-bottom:10px;padding:4px 14px}summary{padding:10px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}.cnt{color:var(--mu);font-weight:400;font-size:14px}
.it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--mu) 25%,transparent);cursor:pointer}
.box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--mu);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.it.on .box{background:var(--ok);border-color:var(--ok)}.it.on span{color:var(--mu);text-decoration:line-through}
#send{position:fixed;left:16px;right:16px;width:auto;bottom:max(16px,env(safe-area-inset-bottom));margin:0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#msg{font-size:13px;color:var(--mu);text-align:center;margin-top:6px}
</style>
</head>
<body>
<!--
  A DA's "Today" card (Telegram Mini App). This file is PUBLIC (GitHub Pages) and holds code only.
  Data in: everything personal rides in the link after "#" (d = base64url raw-deflate JSON), which browsers never send to the server.
  Data out: Telegram.WebApp.sendData (≤4096 bytes; works only when opened from a reply-keyboard button) → the DA poller →
  da-answer.py `deck` (k:"today") → logged locally + a short receipt in chat. Check-offs persist per day in localStorage.
-->
<header><h1 id="ttl">Today</h1><span class="tag" id="lbl">SAMPLE v1</span></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<button class="btn" id="send">Send to coach</button>
<div id="msg"></div>
<script>
const tg=(window.Telegram&&Telegram.WebApp)||null,inTg=!!(tg&&tg.initData!==undefined&&tg.platform&&tg.platform!=="unknown");
if(tg){try{tg.ready();tg.expand();}catch(e){}}
const $=id=>document.getElementById(id),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e;};
function hashParam(n){const h=(location.hash||"").replace(/^#/,"");for(const p of h.split(/[&?]/)){const i=p.indexOf("=");if(i>0&&p.slice(0,i)===n)return p.slice(i+1);}return null;}
function b64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function decode(d){if(typeof DecompressionStream==="undefined")throw new Error("this Telegram version can't open it. Update Telegram.");
  return JSON.parse(await new Response(new Blob([b64u(d)]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text());}
function demo(){return{v:1,title:"Today",label:"DEMO",to:"coach",warm:{min:"One move, 20 seconds. That counts.",cue:"After I make coffee, I do today's move.",
  energy:[["Very low",1],["Low",2],["Medium",3],["Good",3],["Great",3]],brace:"Tighten your stomach a little first.",stop:"Stop if anything hurts sharply.",
  moves:[{id:"a",n:"March in place",pos:"Standing",how:"Easy march, arms swinging.",add:"Balance hold",min:true},{id:"b",n:"Wall push",pos:"Standing at a wall",how:"Slow push-aways.",brace:true},
  {id:"c",n:"Calf raise",pos:"Standing",how:"Up on toes, down slow.",warn:"Demo caution box."}]},
  habits:[{id:"am",n:"Morning",when:"after waking",from:4,items:["Drink water","Open the blinds"]},{id:"pm",n:"Evening",when:"9 pm",from:18,items:["Tidy desk","Lights low"]}],
  court:{n:"Demo warm-up",items:["Walk 2 min","Arm circles"],note:"Demo note."}};}
const now=new Date(),pad=n=>String(n).padStart(2,"0"),DAY=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate()),HR=now.getHours();
let C,KEY,S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){S=null;}if(!S||S.d!==DAY)S={d:DAY,w:{},h:{},c:{},en:null,n:null};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function haptic(k){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(k||"light");}catch(e){}}
let tab,step=-1,timer=null;
function tabs(){const T=[["warm","Warm-up"],["habits","Habits"]];if(C.court)T.push(["court","Court"]);const b=$("tabs");b.innerHTML="";
  for(const[k,n]of T){const x=el("button",k===tab?"on":"",n);x.onclick=()=>{tab=k;step=-1;render();};b.appendChild(x);}}
function moveOrder(){return C.warm.moves;}
function warm(m){const W=C.warm,M=moveOrder();
  if(step<0){const c=el("div","card");c.appendChild(el("div","mu","Minimum"));c.appendChild(el("div","big",W.min));
    const mv=M.find(x=>x.min)||M[0];c.appendChild(el("div","",mv.n+" · "+mv.pos));
    const b=el("button","btn","Start: just the minimum");b.onclick=()=>{S.n=1;S.en=0;save();step=0;render();};c.appendChild(b);
    if(W.cue)c.appendChild(el("div","cue","Cue: "+W.cue));m.appendChild(c);
    const e=el("div","card");e.appendChild(el("div","","More energy? Pick how you feel:"));const g=el("div","en");
    W.energy.forEach(([n,k],i)=>{const x=el("button","",n+"\n"+k+(k>1?" moves":" move"));x.style.whiteSpace="pre-line";x.onclick=()=>{S.n=Math.min(k,M.length);S.en=i;save();step=0;render();};g.appendChild(x);});
    e.appendChild(g);if(W.great)e.appendChild(el("div","mu",W.great));m.appendChild(e);
    const done=M.filter(x=>S.w[x.id]).length;if(done)m.appendChild(el("div","mu","Done so far today: "+done+" move"+(done>1?"s":"")+"."));
    m.appendChild(el("div","stop",W.stop));return;}
  const N=S.n||1;
  if(step>=N){const c=el("div","card");const done=M.filter(x=>S.w[x.id]).length;
    c.appendChild(el("div","big",done?"Done. "+done+" move"+(done>1?"s":"")+". That counts.":"No moves checked yet."));
    c.appendChild(el("div","mu","Press Send to coach below to log it."));
    if(N<M.length){const b=el("button","btn alt","One more move");b.onclick=()=>{S.n=N+1;save();render();};c.appendChild(b);}
    const r=el("button","btn alt","Back to start");r.onclick=()=>{step=-1;render();};c.appendChild(r);m.appendChild(c);m.appendChild(el("div","stop",W.stop));return;}
  const x=M[step],c=el("div","card");c.appendChild(el("div","step","Move "+(step+1)+" of "+N));c.appendChild(el("div","big",x.n));
  c.appendChild(el("div","mu",x.pos));c.appendChild(el("div","",x.how));
  if(x.brace&&W.brace)c.appendChild(el("div","cue",W.brace));
  if(x.add)c.appendChild(el("div","cue","Bonus if energy allows: "+x.add));
  if(x.warn)c.appendChild(el("div","warn",x.warn));
  const t=el("div","timer","0:20");c.appendChild(t);const tb=el("button","btn alt","Start 20-second timer");
  tb.onclick=()=>{clearInterval(timer);let s=20;t.textContent="0:20";tb.disabled=true;timer=setInterval(()=>{s--;t.textContent="0:"+pad(Math.max(s,0));
    if(s<=0){clearInterval(timer);tb.disabled=false;haptic("heavy");try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred("success");}catch(e){}}},1000);};
  c.appendChild(tb);const r=el("div","row2"),sk=el("button","btn alt","Skip"),ok=el("button","btn","✓ Done, next");
  sk.onclick=()=>{clearInterval(timer);step++;render();};ok.onclick=()=>{clearInterval(timer);S.w[x.id]=1;save();haptic();step++;render();};
  r.appendChild(sk);r.appendChild(ok);c.appendChild(r);m.appendChild(c);m.appendChild(el("div","stop",W.stop));}
function list(m,key,items,st,title,sub,open){const d=el("details");if(open)d.open=true;const s=el("summary");s.appendChild(el("span","",title));
  const cnt=el("span","cnt");s.appendChild(cnt);d.appendChild(s);if(sub)d.appendChild(el("div","mu",sub));
  const upd=()=>{cnt.textContent=items.filter((_,i)=>st[i]).length+"/"+items.length;};
  items.forEach((n,i)=>{const r=el("div","it"+(st[i]?" on":""));r.appendChild(el("div","box",st[i]?"✓":""));r.appendChild(el("span","",n));
    r.onclick=()=>{if(st[i])delete st[i];else st[i]=1;r.classList.toggle("on");r.firstChild.textContent=st[i]?"✓":"";upd();save();haptic();};d.appendChild(r);});
  upd();m.appendChild(d);}
function habits(m){let cur=C.habits[0].id;for(const h of C.habits)if(HR>=(h.from||0))cur=h.id;
  for(const h of C.habits){S.h[h.id]=S.h[h.id]||{};list(m,h.id,h.items,S.h[h.id],h.n,h.when,h.id===cur);}}
function court(m){const K=C.court;list(m,"court",K.items,S.c,K.n,null,true);if(K.note)m.appendChild(el("div","cue",K.note));}
function render(){tabs();const m=$("main");m.innerHTML="";({warm,habits,court})[tab](m);window.scrollTo(0,0);}
function envelope(full){const sec=[],M=C.warm.moves,cut=s=>full?s.slice(0,48):"";
  sec.push({n:"Warm-up",done:M.filter(x=>S.w[x.id]).map(x=>cut(x.n)).filter(Boolean),k:M.filter(x=>S.w[x.id]).length,of:M.length});
  for(const h of C.habits){const st=S.h[h.id]||{},dn=h.items.filter((_,i)=>st[i]);sec.push({n:h.n,done:dn.map(cut).filter(Boolean),k:dn.length,of:h.items.length});}
  if(C.court){const dn=C.court.items.filter((_,i)=>S.c[i]);sec.push({n:"Court warm-up",done:dn.map(cut).filter(Boolean),k:dn.length,of:C.court.items.length});}
  const en=S.en!=null&&C.warm.energy[S.en]?C.warm.energy[S.en][0]:null;
  return JSON.stringify({v:1,k:"today",s:C.ver||"",a:[],d:DAY,at:pad(now.getHours())+":"+pad(now.getMinutes()),en:en,sec:sec});}
function send(){let s=envelope(true);if(new Blob([s]).size>4000)s=envelope(false);
  if(inTg&&typeof tg.sendData==="function"&&!(tg.initDataUnsafe&&tg.initDataUnsafe.query_id)){try{tg.sendData(s);return;}catch(e){$("msg").textContent="Couldn't send: "+e.message;return;}}
  $("msg").textContent="Preview only: open this from the ☀️ Today button in the coach chat to send.";console.log(s);}
(async()=>{const d=hashParam("d");try{C=d?await decode(d):demo();}catch(e){$("main").textContent="Couldn't open the card: "+e.message;return;}
  KEY="today:"+(C.to||"x");load();$("ttl").textContent=C.title||"Today";$("lbl").textContent=C.label||"";
  if(C.to)$("send").textContent="Send to "+(C.toName||C.to);
  $("send").onclick=send;tab=(HR>=4&&HR<13)?"warm":"habits";render();})();
</script>
<!-- sticky-title v7 -->
<style id="st-style">
  html { scroll-padding-top: 3.5rem; }
  #st-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2147483000;
    padding: .55rem max(1rem, env(safe-area-inset-left)); box-sizing: border-box;
    font: 600 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: #fff; color: #111; border-bottom: 1px solid rgba(127,127,127,.25);
    box-shadow: 0 1px 6px rgba(0,0,0,.08); cursor: pointer; display: none; }
  #st-bar.st-on { display: block; }
  @media (prefers-color-scheme: dark) { #st-bar { background: #1c1c1e; color: #eee; } }
  @media print { #st-bar { display: none; } }
</style>
<div id="st-bar" role="presentation" title="Back to top"></div>
<script id="st-script">
(function () {
  var bar = document.getElementById("st-bar");
  if (!bar) return;
  var target = document.querySelector("h1") || document.querySelector("header") || document.querySelector("h2");
  var text = (target && target.textContent.trim()) || document.title || "";
  text = text.replace(/\s+/g, " ");
  if (!text) { bar.remove(); return; }
  bar.textContent = text;
  // Match the page's own colors (pages set their own light/dark palettes).
  function paint() {
    var bg = "", el = document.body;
    while (el && !bg) {
      var c = getComputedStyle(el).backgroundColor;
      if (c && c !== "transparent" && !/rgba\([^)]*,\s*0\)$/.test(c)) bg = c;
      el = el === document.body ? document.documentElement : null;
    }
    if (bg) { bar.style.background = bg; bar.style.color = getComputedStyle(document.body).color; }
  }
  paint();
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", paint);
  }
  bar.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
  // Shown whenever the page's own title is off-screen (scrolled past, or
  // below the fold under a contents list) so a title is always visible.
  function offscreen() {
    if (!target) return window.scrollY > 40;
    var r = target.getBoundingClientRect();
    return r.top < 0 || r.bottom > window.innerHeight;  // not fully on screen
  }
  // Title starts below the fold → reserve the bar's height so it never covers
  // the first lines of the page.
  if (target && offscreen() && window.scrollY < 8) {
    bar.classList.add("st-on");
    document.body.style.paddingTop = (parseFloat(getComputedStyle(document.body).paddingTop) || 0) + bar.offsetHeight + "px";
  }
  // The page's own things pinned at the top (sticky headers, tab rows, table
  // header cells): if one already shows the title, stay hidden; otherwise push
  // it below this bar so nothing is covered. Shallow scan + table headers only;
  // sticky elements with top:auto (left-pinned columns) are left alone.
  var cands = Array.prototype.filter.call(
    document.querySelectorAll("body>*,body>*>*,body>*>*>*,body>*>*>*>*,thead,thead>tr,th"),
    function (e) {
      if (e === bar) return false;
      var cs = getComputedStyle(e);
      return cs.position === "fixed" || (cs.position === "sticky" && cs.top !== "auto");
    });
  var words = text.toLowerCase().match(/[a-z0-9]{4,}/g) || [];
  var shifted = [];
  function carriesTitle(e) {
    if (target && e.contains(target)) return true;
    if (!words.length) return false;
    var t = e.textContent.toLowerCase(), n = 0;
    words.forEach(function (w) { if (t.indexOf(w) >= 0) n++; });
    return n / words.length >= 0.6;
  }
  function pinnedTop() {
    var bh = bar.offsetHeight || 0;
    return cands.filter(function (e) {
      var r = e.getBoundingClientRect(), lim = shifted.indexOf(e) >= 0 ? bh + 1 : 1;
      return r.height > 0 && r.height < window.innerHeight * 0.5 && r.top <= lim && r.bottom > 0;
    });
  }
  function update() {
    var on = offscreen(), pins = cands.length ? pinnedTop() : [];
    if (on && pins.some(carriesTitle)) on = false;
    bar.classList.toggle("st-on", on);
    if (on) {
      var bh = bar.offsetHeight;
      pins.forEach(function (e) {
        if (shifted.indexOf(e) < 0) { e.setAttribute("data-st-top", e.style.top); e.style.top = bh + "px"; shifted.push(e); }
      });
    } else if (shifted.length) {
      shifted.forEach(function (e) { e.style.top = e.getAttribute("data-st-top") || ""; e.removeAttribute("data-st-top"); });
      shifted = [];
    }
  }
  window.addEventListener("scroll", update, { passive: true });
  window.addEventListener("resize", update);
  update();
})();
</script>
<!-- /sticky-title -->
</body>
</html>
