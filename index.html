<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Decision Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="telegram-web-app.js"></script>
<style>
/* Layout: phone first — one slim header row (agent picker · progress · send), then the card fills the screen, then a slim
   button row. ≥900px keeps the desktop layout: title, agent tabs, "up next" rail (left), "answered" ledger (right), key hints. */
:root {
  --bg: #e9ecf1; --surface: #ffffff; --sunk: #f3f5f8; --ink: #14171c; --muted: #5a6271; --faint: #8b93a1; --line: #d8dde5;
  --accent: #1f3a8a;
  --yes: #15803d; --no: #c2321f; --later: #b7620b; --more: #3a5fb0;
  --ada: #b4532a; --coach: #0f766e; --sosh: #b0256a; --lib: #6b3fc6; --finn: #2f7d32; --tek: #2b56c6;
  --shadow: 0 1px 2px rgba(20,23,28,.06), 0 8px 24px rgba(20,23,28,.10);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1115; --surface: #1a1d23; --sunk: #14161b; --ink: #eef1f5; --muted: #a3abb8; --faint: #6f7785; --line: #2b3039;
  --accent: #9db4ff; --yes: #3fbf6a; --no: #f0644f; --later: #f0a33b; --more: #7e9df0;
  --ada: #e08a5f; --coach: #3cbfb2; --sosh: #ec6aa7; --lib: #a88bf0; --finn: #6cc070; --tek: #7d9ef5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #1a1d23; --sunk: #14161b; --ink: #eef1f5; --muted: #a3abb8; --faint: #6f7785; --line: #2b3039;
  --accent: #9db4ff; --yes: #3fbf6a; --no: #f0644f; --later: #f0a33b; --more: #7e9df0;
  --ada: #e08a5f; --coach: #3cbfb2; --sosh: #ec6aa7; --lib: #a88bf0; --finn: #6cc070; --tek: #7d9ef5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased;
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
button, select { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { height: 100%; display: flex; flex-direction: column; max-width: 1240px; margin: 0 auto;
  padding: env(safe-area-inset-top, 0px) 12px env(safe-area-inset-bottom, 0px); }
.app > * { min-width: 0; }

/* header: phone = one row; desktop adds the title block */
.top { display: flex; align-items: center; gap: 10px; padding-block: 10px 8px; position: relative; }
.brand { display: none; min-width: 0; flex: 1; }
.brand h1 { font: 700 20px/1.1 var(--f-display); letter-spacing: -.01em; margin: 0; }
.brand .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick { position: relative; display: inline-flex; align-items: center; gap: 7px; min-width: 0; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 5px 30px 5px 6px; font-weight: 700; font-size: 14px; }
.pick select { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; font-size: 16px; }
.pick .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .n { font: 500 12px var(--f-mono); color: var(--faint); }
.pick svg { position: absolute; right: 10px; width: 12px; height: 12px; color: var(--muted); pointer-events: none; }
.dot { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--f-display); color: #fff; background: var(--c, var(--accent)); }
.dot.all { background: var(--ink); color: var(--bg); }
.tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--later);
  border: 1px solid color-mix(in srgb, var(--later) 45%, var(--line)); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.sp { flex: 1; }
.count { font: 500 12.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tally { display: none; font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.tally b { color: var(--ink); font-weight: 500; }
.done { border: 0; border-radius: 999px; padding: 7px 14px; background: var(--yes); color: #fff; font-weight: 700; cursor: pointer; white-space: nowrap; }
.done:disabled { opacity: .35; cursor: default; background: var(--ink); color: var(--bg); }
.progress { position: absolute; left: 0; right: 0; bottom: 2px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--yes); transition: width .25s; }
.banner { margin: 2px 0 8px; padding: 8px 12px; border-radius: 10px; background: var(--sunk); border: 1px dashed var(--line); color: var(--muted); font-size: 12.5px; }
.banner b { color: var(--ink); }
.banner.demo { display: none; }

/* desktop tabs (hidden on phones: the picker replaces them) */
.tabs { display: none; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 10px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 8px;
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13.5px; }
.tab .dot { width: 18px; height: 18px; font-size: 10px; }
.tab .n { font: 500 11.5px var(--f-mono); color: var(--faint); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-selected="true"] .n { color: inherit; opacity: .7; }

/* main stage */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.rail { display: none; }
.stage { position: relative; min-height: 0; display: grid; place-items: stretch; padding-bottom: 8px; }
.stack { position: relative; width: 100%; height: 100%; }
.card { position: absolute; inset: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow);
  border: 1px solid var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform; overflow: hidden; --fs: 1; }
.card.behind { pointer-events: none; }
.card.dragging { cursor: grabbing; transition: none !important; }
.card.settle { transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s; }
.card .band { position: absolute; left: 0; top: 0; right: 0; height: 4px; background: var(--c); }
.card .body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: calc(12px * var(--fs)); }

.meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.who { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; color: var(--ink); }
.mono { flex: none; width: 24px; height: 24px; border-radius: 7px; background: var(--c); color: #fff; display: grid; place-items: center; font: 700 12px var(--f-display); }
.kind { text-transform: uppercase; letter-spacing: .07em; font-size: 10.5px; font-weight: 700; color: var(--more); }
.meta .sp { flex: 1; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--sunk); border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.hot { color: var(--no); border-color: color-mix(in srgb, var(--no) 40%, var(--line)); background: color-mix(in srgb, var(--no) 8%, var(--surface)); font-weight: 700; }
.chip.warm { color: var(--later); border-color: color-mix(in srgb, var(--later) 40%, var(--line)); }

.title { font: 700 calc(25px * var(--fs))/1.16 var(--f-display); letter-spacing: -.015em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.prop { border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); font-size: calc(15px * var(--fs)); }
.prop .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); display: block; margin-bottom: 2px; }
.why { color: var(--ink); font-size: calc(15.5px * var(--fs)); line-height: 1.45; margin: 0; overflow-wrap: anywhere; }
.skip, .how { color: var(--muted); font-size: calc(14.5px * var(--fs)); margin: 0; overflow-wrap: anywhere; }
.skip b, .how b { color: var(--ink); font-weight: 700; }
.fade { display: none; position: absolute; left: 1px; right: 1px; bottom: 1px; height: 76px; border-radius: 0 0 var(--r) var(--r);
  background: linear-gradient(to bottom, transparent, var(--surface) 62%); align-items: end; justify-content: center; padding-bottom: 12px;
  font-size: 12.5px; font-weight: 700; color: var(--more); pointer-events: none; }
.card.clipped .fade { display: flex; }
.hints { display: none; grid-template-columns: 1fr auto 1fr; align-items: center; font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 10px; }
.hints .l { color: var(--no); } .hints .r { color: var(--yes); text-align: right; } .hints .u { color: var(--later); text-align: center; }
.hints b { font-weight: 700; }

/* swipe stamps: a fixed layer over the screen (they don't ride the card), upper third, on the side the swipe starts FROM —
   clear of the thumb and never carried off-screen */
.stamps { position: fixed; inset: 0; pointer-events: none; z-index: 26; }
.stamp { position: absolute; top: 24%; padding: 7px 14px; border: 3px solid currentColor; border-radius: 12px; font: 700 22px var(--f-display);
  text-transform: uppercase; letter-spacing: .05em; opacity: 0; background: var(--surface); white-space: nowrap; box-shadow: var(--shadow); }
.stamp.s-y  { left: 20px;  color: var(--yes);   transform: rotate(-8deg); }
.stamp.s-n  { right: 20px; color: var(--no);    transform: rotate(8deg); }
.stamp.s-left { right: 20px; color: var(--later); transform: rotate(8deg); }   /* left swipe = "Not now" (or "No" on a yes/no card) */
.stamp.s-d  { left: 50%; top: 18%; transform: translateX(-50%); color: var(--yes); }
.stamp.s-l3 { right: 20px; color: var(--later); transform: rotate(6deg); }
.stamp.s-l7 { left: 20px;  color: var(--later); transform: rotate(-6deg); }

.empty { text-align: center; padding: 28px; max-width: 360px; }
.empty h2 { font: 700 24px var(--f-display); margin: 8px 0; }
.empty p { color: var(--muted); margin: 0 0 16px; }
.empty .big { font: 700 44px var(--f-display); color: var(--yes); }

/* controls */
.controls { display: flex; justify-content: center; align-items: center; gap: 18px; padding-block: 4px 12px; }
.fab { border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); border-radius: 50%; width: 48px; height: 48px; display: grid; place-items: center; cursor: pointer; position: relative; }
.fab svg { width: 22px; height: 22px; }
.fab.big { width: 58px; height: 58px; } .fab.big svg { width: 27px; height: 27px; }
.fab.small { width: 40px; height: 40px; box-shadow: none; } .fab.small svg { width: 18px; height: 18px; }
.fab.no { color: var(--no); } .fab.yes { color: var(--yes); } .fab.later { color: var(--later); } .fab.more { color: var(--more); display: none; } .fab.undo { color: var(--muted); }
.fab:active { transform: scale(.94); }
.fab:disabled { opacity: .35; cursor: default; }
.controls .ghost { width: 40px; }

/* details: the same card, opened up — full text plus extra choices; tap empty space to go back, swipe = same as the card */
.dwrap { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,16,.45); display: grid; justify-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
.dwrap .card { position: relative; inset: auto; width: min(100%, 560px); height: 100%; cursor: default; padding: 0; }
.dwrap .dscroll { height: 100%; overflow: hidden; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.dwrap .why { font-size: 16.5px; } .dwrap .title { font-size: 24px; }
.sec h3 { margin: 0 0 4px; font: 700 11px var(--f-mono, ui-monospace, monospace); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.sec p, .sec ul { margin: 0; font-size: calc(15px * var(--fs, 1)); line-height: 1.45; color: var(--ink); overflow-wrap: anywhere; }
.sec ul { padding-left: 18px; display: grid; gap: 4px; }
.sec .cmd { display: block; margin-top: 4px; font: 500 12px/1.45 var(--f-mono, ui-monospace, monospace); background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; overflow-wrap: anywhere; user-select: all; }
.dsep { border: 0; border-top: 1px dashed var(--line); margin: 2px 0; width: 100%; }
.sec.warn h3 { color: var(--later); }
.home { margin: 0; font-size: 12px; color: var(--faint); }
.dfoot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.choices { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.choice.y, .choice.n { grid-column: span 3; } .choice.l { grid-column: span 2; font-size: 14px; }
.choice { border: 1px solid var(--line); background: var(--sunk); border-radius: 12px; padding: 11px 8px; cursor: pointer; font-weight: 700; text-align: center; }
.choice.y { color: var(--yes); } .choice.n { color: var(--no); } .choice.l { color: var(--later); } .choice.d { color: var(--yes); }
.choice.wide { grid-column: span 3; font-size: 14px; } .choice.left { grid-column: span 3; font-size: inherit; }
textarea { width: 100%; min-height: 64px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); padding: 10px 12px; font: 16px/1.4 var(--f-body); resize: none; user-select: text; -webkit-user-select: text; }
.replyrow { display: flex; gap: 8px; }
.replyrow textarea { flex: 1; }
.replyrow .btn { align-self: stretch; }
.idline { font: 500 11.5px var(--f-mono); color: var(--faint); overflow-wrap: anywhere; text-align: center; }

/* send-preview sheet (outside Telegram only) */
.scrim { position: fixed; inset: 0; background: rgba(10,12,16,.45); z-index: 25; display: grid; align-items: end; justify-items: center; }
.sheet { width: min(100%, 560px); max-height: 88%; overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { font: 700 21px/1.2 var(--f-display); margin: 6px 0 10px; text-wrap: balance; }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 700; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.payload { font: 500 11.5px/1.5 var(--f-mono); background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 30; max-width: calc(100% - 32px); }

/* wide screens: the desktop layout */
@media (min-width: 600px) { .tally { display: block; } .count { display: none; } }
@media (min-width: 900px) {
  .app { padding-inline: 16px; }
  .top { gap: 12px; padding-block: 14px 8px; }
  .brand { display: block; } .pick, .top .tag, .progress { display: none; }
  .done { padding: 9px 16px; background: var(--ink); color: var(--bg); }
  .banner.demo { display: block; }
  .tabs { display: flex; }
  .main { grid-template-columns: 250px minmax(0, 1fr) 270px; }
  .stage { place-items: center; padding-bottom: 0; }
  .stack { width: min(100%, 460px); height: min(100%, 600px); }
  .card { padding: 18px 18px 14px; }
  .hints { display: grid; }
  .controls { gap: 14px; padding-block: 12px 14px; }
  .fab { width: 52px; height: 52px; } .fab svg { width: 24px; height: 24px; }
  .fab.big { width: 64px; height: 64px; } .fab.big svg { width: 30px; height: 30px; }
  .fab.small { width: 42px; height: 42px; box-shadow: var(--shadow); }
  .fab.more { display: grid; } .controls .ghost { display: none; }
  .rail { display: flex; flex-direction: column; min-height: 0; gap: 8px; }
  .rail h4 { margin: 4px 2px; font: 700 12px var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
  .rail ol { list-style: none; margin: 0; padding: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .rail li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; font-size: 13px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start; }
  .rail li .mono { width: 20px; height: 20px; border-radius: 6px; font-size: 10.5px; }
  .rail li .tx { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rail li .v { font: 500 11px var(--f-mono); color: var(--faint); }
  .rail li .v.y { color: var(--yes); } .rail li .v.n { color: var(--no); } .rail li .v.l { color: var(--later); } .rail li .v.t { color: var(--more); } .rail li .v.d { color: var(--yes); }
  .rail .none { color: var(--faint); font-size: 13px; padding: 4px 2px; }
  .dwrap { padding-block: 40px; }
}
@media (prefers-reduced-motion: reduce) { .card.settle { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1 id="deckName">Decision Deck</h1><div class="sub" id="sub">Loading…</div></div>
    <label class="pick" id="pick" aria-label="Show cards from"><span class="dot all" id="pickDot">★</span><span class="lbl" id="pickLbl">All</span><span class="n" id="pickN"></span>
      <select id="pickSel"></select><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></label>
    <span class="tag" id="modeTag" hidden></span>
    <span class="sp"></span>
    <span class="count" id="count"></span>
    <div class="tally" id="tally"></div>
    <button class="done" id="doneBtn" type="button" disabled>Done</button>
    <div class="progress" aria-hidden="true"><i id="prog"></i></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Agents"></nav>
  <main class="main">
    <aside class="rail" aria-label="Up next"><h4>Up next</h4><ol id="nextList"></ol></aside>
    <section class="stage" aria-live="polite"><div class="stack" id="stack"></div></section>
    <aside class="rail" aria-label="Answered"><h4>Answered</h4><ol id="ansList"></ol></aside>
  </main>
  <footer class="controls" id="controls">
    <button class="fab small undo" id="bUndo" type="button" aria-label="Undo last answer (U)" title="Undo (U)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="fab big later" id="bNo" type="button" aria-label="Not now (swipe left)" title="← key · 3 = 3 days · 7 = next week"></button>
    <button class="fab more" id="bMore" type="button" aria-label="Details (tap the card)" title="↓ key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
    <button class="fab big yes" id="bYes" type="button" aria-label="Swipe right" title="→ key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg></button>
    <span class="ghost" aria-hidden="true"></span>
  </footer>
</div>
<div class="dwrap" id="dwrap" hidden></div>
<div class="stamps" id="stampLayer" aria-hidden="true"></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* Decision Deck — Telegram Mini App (DA attention redesign, D-deck). Data in: URL fragment `d=` (raw-deflate JSON, base64url)
   built by ~/.claude/scripts/da-deck-snapshot.py — the host never sees it. Data out: Telegram.WebApp.sendData (≤4096 bytes,

  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", () => { active = false; card.classList.remove("dragging"); reset(); });
}
function topCard() { return $("stack").querySelector(".card:not(.behind)"); }
function decide(c, card, dx, dy, v, text) {
  const q = queue(); if (!q.length) return; const it = q[0];
  const inDetail = !$("dwrap").hidden; card = card || (inDetail ? $("dwrap").querySelector(".card") : topCard());
  const left = c === "left"; if (left) { const L = leftOf(it); c = L.c; v = L.v; }
  if (c === "d" && !canDone(it)) return;
  if (c === "l" && !v) v = 1;
  answers = answers.filter(a => a.id !== it.i).concat([{ id: it.i, c, v: c === "t" ? text : c === "l" ? v : undefined }]);
  saveLocal(); haptic(c);
  const after = () => { if (inDetail) closeMore(true); render(); };
  if (card) {
    const W = window.innerWidth, H = window.innerHeight;
    const tx = c === "y" || c === "d" ? W : left || c === "n" ? -W : c === "l" ? (v === 3 ? -W * .6 : W * .6) : (dx || 0);
    const ty = c === "l" && !left ? -H : c === "t" ? -H * .2 : (dy || 0);
    card.classList.add("settle"); card.style.transform = `translate(${tx}px, ${ty}px) rotate(${c === "y" || c === "d" ? 18 : left || c === "n" ? -18 : 0}deg)`; card.style.opacity = 0;
    const L = $("stampLayer"), s = L.querySelector(".stamp.s-" + (left ? "left" : c === "t" ? "y" : c === "l" ? "l" + v : c)); if (s) { L.querySelectorAll(".stamp").forEach(x => x.style.opacity = 0); s.style.opacity = 1; }
    setTimeout(after, 220);
  } else after();
}
function haptic(c) { if (inTg && tg.HapticFeedback && can("6.1")) { try { c === "n" ? tg.HapticFeedback.notificationOccurred("warning") : tg.HapticFeedback.impactOccurred("light"); } catch (e) {} } }
function undo() { if (!answers.length) return; const a = answers.pop(); saveLocal(); const it = items().find(x => x.i === a.id); if (it && tab !== "all" && it.d !== tab) tab = "all"; render(); toast("Undone"); }

/* ---------- details: the card opened up ---------- */
let backFn = null;
function closeMore(silent) {
  $("dwrap").hidden = true; $("dwrap").innerHTML = "";
  if (inTg && tg.BackButton && can("6.1")) { if (backFn) tg.BackButton.offClick(backFn); tg.BackButton.hide(); }
  backFn = null; void silent;
}
function openMore() {
  const it = queue()[0]; if (!it) return; const [yl, nl] = labels(it), L = leftOf(it);
  const W = $("dwrap");
  W.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="${esc(it.t)}" style="--c:var(--${it.d in DA ? it.d : "ada"})"><div class="band"></div>
    <div class="dscroll">${bodyHTML(it, true)}
      <div class="dfoot">
        <div class="choices"><button class="choice left ${L.c === "n" ? "n" : "l"}" data-c="left" type="button">${esc(L.lbl)}</button><button class="choice y" data-c="y" type="button">${esc(yl)}</button>
          ${canDone(it) ? `<button class="choice d wide" data-c="d" type="button">✓ Already done</button><button class="choice n wide" data-c="n" type="button">${esc(nl)}</button>` : ""}
          ${LATER.map(([v, l]) => `<button class="choice l wide" data-c="l" data-v="${v}" type="button">${l}</button>`).join("")}</div>
        <div class="replyrow"><textarea id="reply" rows="2" placeholder="Or answer in your own words…" maxlength="600"></textarea><button class="btn primary" id="sendReply" type="button">Reply</button></div>
      </div></div></div>`;
  W.hidden = false;
  const card = W.querySelector(".card");
  bindSwipe(card, { scroller: W.querySelector(".dscroll"), onTap: () => closeMore() });
  W.onclick = e => { if (e.target === W) closeMore(); };
  W.querySelectorAll(".choice").forEach(b => b.onclick = () => decide(b.dataset.c, card, 0, 0, b.dataset.v ? +b.dataset.v : undefined));
  $("sendReply").onclick = () => { const t = $("reply").value.trim(); if (!t) { $("reply").focus(); return; } decide("t", card, 0, 0, undefined, t); };
  if (inTg && tg.BackButton && can("6.1")) { backFn = () => closeMore(); tg.BackButton.show(); tg.BackButton.onClick(backFn); }
}
function openSheet(html) {
  $("sheet").innerHTML = `<div class="grab"></div>` + html; $("scrim").hidden = false;
  $("scrim").onclick = e => { if (e.target === $("scrim")) $("scrim").hidden = true; };
}

/* ---------- data out ---------- */
function envelope() {
  const a = answers.map(x => x.c === "t" ? [x.id, "t", x.v] : x.c === "l" ? [x.id, "l", x.v] : [x.id, x.c]);
  const env = { v: 1, s: SNAP ? SNAP.ver : "", k: SNAP ? SNAP.deck : "", a };
  let s = JSON.stringify(env); const enc = new TextEncoder();
  // fit ≤4096 bytes: shorten the longest free-text answer until it fits (choice codes are tiny)
  let guard = 0;
  while (enc.encode(s).length > MAX_BYTES && guard++ < 200) {
    let li = -1, ll = 0; env.a.forEach((r, i) => { if (r[1] === "t" && r[2].length > ll) { ll = r[2].length; li = i; } });
    if (li < 0 || ll < 40) break; env.a[li][2] = env.a[li][2].slice(0, Math.floor(ll * .8)) + "…"; s = JSON.stringify(env);
  }
  return { s, bytes: enc.encode(s).length, trimmed: guard > 0 };
}
function send() {
  if (!answers.length) return;
  const { s, bytes, trimmed } = envelope();
  if (bytes > MAX_BYTES) return toast("Too much to send in one go — send what you have, then reopen the deck.");
  if (inTg && typeof tg.sendData === "function" && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id)) {
    try { sentMark(); tg.sendData(s); return; }   // Telegram closes the app on success; the mark stops a re-send of the same answers
    catch (e) { saveLocal(); return toast("Telegram refused the send (" + (e.message || e) + "). Your answers are saved — reopen from the 📋 button."); }
  }
  // outside Telegram (demo / preview): show exactly what would be sent
  const why = inTg ? "This deck was opened from a link, not the 📋 keyboard button, so Telegram won't accept answers from it. Open it from the 📋 button under the chat." :
    SNAP && SNAP.demo ? "Example mode: this is what the agents would receive." : "Preview mode (opened in a browser): Telegram isn't here to deliver this. Open the deck from the 📋 button in Telegram.";
  openSheet(`<h3>${answers.length} answer${answers.length > 1 ? "s" : ""} ready</h3><p style="color:var(--muted);margin:0 0 10px">${esc(why)}</p>
    <div class="payload" id="payload">${esc(s)}</div><p class="idline" style="margin:8px 0 0;text-align:left">${bytes} of ${MAX_BYTES} bytes${trimmed ? " · long replies trimmed to fit" : ""}</p>
    <div class="row"><button class="btn" id="copyP" type="button">Copy</button><button class="btn primary" id="okP" type="button">Close</button></div>`);
  $("copyP").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(s).then(() => toast("Copied"), () => toast("Select the text to copy")); };
  $("okP").onclick = () => { $("scrim").hidden = true; };
}

let toastT; function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- boot ---------- */
async function boot() {
  if (inTg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    if (can("7.7") && tg.disableVerticalSwipes) try { tg.disableVerticalSwipes(); } catch (e) {}   // swipe-up = Later, not close
    if (tg.colorScheme) document.documentElement.setAttribute("data-theme", tg.colorScheme);
    if (tg.MainButton) tg.MainButton.onClick(send);
    if (can("6.2") && tg.enableClosingConfirmation) try { tg.enableClosingConfirmation(); } catch (e) {}
  }
  const d = hashParam("d"), j = hashParam("j");
  try {
    if (d) { SNAP = await decode(d); MODE = inTg ? "live" : "preview"; }
    else if (j) { SNAP = JSON.parse(new TextDecoder().decode(b64u(j))); MODE = inTg ? "live" : "preview"; }
    else { SNAP = demo(); MODE = "demo"; }
  } catch (e) {
    SNAP = { v: 1, ver: "err", gen: new Date().toISOString(), deck: "ada", items: [] }; MODE = "error";
    $("banner").hidden = false; $("banner").innerHTML = `<b>Couldn't open this deck.</b> ${esc(e.message || e)} Ask the agent to resend the 📋 button.`;
  }
  if (!Array.isArray(SNAP.items)) SNAP.items = [];
  const num = v => (typeof v === "number" && isFinite(v)) ? v : (v == null || v === "" ? undefined : (isFinite(+v) ? +v : undefined));
  SNAP.items = SNAP.items.filter(it => it && typeof it.i === "string").map(it => Object.assign({}, it, {
    d: Object.prototype.hasOwnProperty.call(DA, it.d) ? it.d : "ada", P: num(it.P), I: num(it.I), T: num(it.T), a: num(it.a) || 0,
    dl: /^\d{4}-\d{2}-\d{2}$/.test(it.dl || "") ? it.dl : undefined }));
  const B = $("banner");
  if (MODE === "demo") { B.hidden = false; B.classList.add("demo"); B.innerHTML = "<b>Example deck.</b> These cards are made up. Your real deck opens from the 📋 button in Ada's or Tek's chat."; }
  else if (MODE === "preview") { B.hidden = false; B.classList.add("demo"); B.innerHTML = "<b>Preview.</b> Opened outside Telegram, so answers can't be delivered from here."; }
  const saved = await loadLocal();
  if (saved && saved.length) {
    const ids = new Set(SNAP.items.map(i => i.i)); const keep = saved.filter(a => ids.has(a.id));
    if (saved.sentAt) {
      SENT = new Set(keep.map(a => a.id));
      if (SENT.size) {
        const B = $("banner"); B.hidden = false; B.classList.remove("demo");
        B.innerHTML = `<b>${SENT.size} answer${SENT.size > 1 ? "s" : ""} sent ${esc(ago(saved.sentAt))}.</b> If the agent said it couldn't record them, <button class="btn" id="resend" type="button">show them again</button>`;
        $("resend").onclick = () => { answers = keep; SENT = new Set(); B.hidden = true; render(); toast("Answers back. Press Send when ready."); };
      }
    }
    else { answers = keep; if (answers.length) toast(`Restored ${answers.length} unsent answer${answers.length > 1 ? "s" : ""}`); }
  }
  $("doneBtn").onclick = send;
  $("pickSel").onchange = e => { tab = e.target.value; render(); };
  $("bYes").onclick = () => decide("y"); $("bNo").onclick = () => decide("left");
  $("bMore").onclick = openMore; $("bUndo").onclick = undo;
  document.addEventListener("keydown", e => {
    if (!$("scrim").hidden) { if (e.key === "Escape") $("scrim").hidden = true; return; }
    if (e.target && e.target.tagName === "TEXTAREA") return;
    const k = e.key, open = !$("dwrap").hidden;
    if (k === "Escape" && open) closeMore();
    else if (k === "ArrowRight") decide("y"); else if (k === "ArrowLeft") decide("left"); else if (k === "d" || k === "D") decide("d");
    else if (k === "3") decide("l", null, 0, 0, 3); else if (k === "7" || k === "w") decide("l", null, 0, 0, 7);
    else if (k === "ArrowDown" || k === "Enter" || k === " ") { e.preventDefault(); open ? closeMore() : openMore(); } else if (k === "u" || k === "U" || k === "Backspace") undo();
    else return; e.preventDefault();
  });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });
  render();
}
boot();
</script>
