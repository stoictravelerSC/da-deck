<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAMPLE v11 · Today</title>
<script src="telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#16181d);--mu:var(--tg-theme-hint-color,#7a7f8a);
--ac:var(--tg-theme-button-color,#2f7de1);--act:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f3f6);--ok:#2e9e5b;--x:#c98a1b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:var(--tg-theme-bg-color,#17191d);--tx:var(--tg-theme-text-color,#eceef2);
--mu:var(--tg-theme-hint-color,#8b919c);--card:var(--tg-theme-secondary-bg-color,#22252b)}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:12px 16px 96px;-webkit-tap-highlight-color:transparent;max-width:640px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
h1{font-size:22px;margin:0}.tag{font-size:11px;color:var(--mu);border:1px solid var(--mu);border-radius:6px;padding:1px 6px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;padding:9px 2px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:15px}
.tabs button.on{background:var(--ac);color:var(--act);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.mu{color:var(--mu);font-size:14px}.big{font-size:24px;font-weight:700;margin:2px 0 6px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--act);font-size:17px;font-weight:600;margin-top:10px;cursor:pointer}
.btn.alt{background:var(--bg);color:var(--tx);font-weight:500}.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.mood{display:flex;gap:6px;margin-top:8px}.mood button{flex:1;padding:11px 0;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font-size:17px;cursor:pointer}
.mood button.on{background:var(--ac);color:var(--act);font-weight:700}
.dots{display:flex;gap:5px;margin:8px 0 2px}.dot{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--mu) 30%,transparent)}
.dot.x{flex:.8;opacity:.75}.dot.on{background:var(--ok)}.dot.x.on{background:var(--x)}.dot.cur{background:var(--ac)}
.timer{font-size:56px;font-weight:700;text-align:center;margin:8px 0 0;font-variant-numeric:tabular-nums}
.side{text-align:center;font-weight:600;color:var(--ac);min-height:22px}.how{font-size:16px;margin-top:4px}
.lv{display:flex;gap:6px;margin-top:8px;font-size:13px}.lv span{flex:1;text-align:center;padding:5px 0;border-radius:8px;background:var(--bg);color:var(--mu)}
.lv span.on{background:color-mix(in srgb,var(--ok) 18%,var(--bg));color:var(--ok);font-weight:600}
.party{text-align:center;padding:26px 16px}.party .em{font-size:64px;line-height:1}
details{background:var(--card);border-radius:14px;margin-bottom:10px;padding:4px 16px}summary{padding:10px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;cursor:pointer}
summary::-webkit-details-marker{display:none}.cnt{color:var(--mu);font-weight:400;font-size:14px}
.gh{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);padding:12px 0 2px}
.it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--mu) 25%,transparent);cursor:pointer}
.it .opt{color:var(--mu);font-size:13px}
.box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--mu);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.it.on .box{background:var(--ok);border-color:var(--ok)}.it.on span{color:var(--mu);text-decoration:line-through}
a.lnk{color:var(--ac)}
#send{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));width:auto;max-width:608px;margin:0 auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pthead{display:flex;justify-content:space-between;align-items:baseline}.ptc{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.ptr{display:flex;gap:8px;align-items:center}
.qk{border:0;border-radius:9px;padding:6px 10px;background:var(--bg);color:var(--ac);font-size:14px;font-weight:600;cursor:pointer}.row2.ic .btn{font-size:24px;padding:10px}
#msg{font-size:13px;color:var(--mu);text-align:center;margin-top:6px}
.flip{position:relative;aspect-ratio:16/9;margin:10px 0 2px;border-radius:10px;overflow:hidden;background:#fff}.flip img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s}.flip img.b,.flip.on img.a{opacity:0}.flip.on img.b{opacity:1}
.seq{margin:8px 0 0;padding-left:22px;font-size:15px}.seq li{padding:2px 0}.side.wait{color:var(--x)}
.bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--mu) 30%,transparent);overflow:hidden;margin-top:12px}.bar>div{height:100%;background:var(--ok)}
</style>
</head>
<body>
<!--
  A DA's "Today" card (Telegram Mini App), SAMPLE v11. This file is PUBLIC (GitHub Pages) and holds code only.
  Data in: everything personal rides in the link after "#" (d = base64url raw-deflate JSON), which browsers never send to the server.
  Data out: Telegram.WebApp.sendData (≤4096 bytes; works only when opened from a reply-keyboard button) → the DA poller →
  da-answer.py `deck` (k:"today") → logged locally + a short receipt in chat. Each Send carries the whole day so far.
  Tabs follow the time of day; PT modules (C.pts: exercises "ex", stretches "st"; each one tap = a timed auto-run of the whole sequence, a finished run = 1 set/round, counted across tabs) sit where a tab's {type:"pt",m} block puts them. Item photos (img:[start,end]) flip every 1.2 s. State: the day (4 am to 4 am) and the move rotation live in Telegram CloudStorage (shared by phone + Mac) with a localStorage copy.
-->
<header><h1 id="ttl">Today</h1><span class="tag" id="lbl">SAMPLE v11</span></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<button class="btn" id="send">Send</button>
<div id="msg"></div>
<script>
const tg=(window.Telegram&&Telegram.WebApp)||null,inTg=!!(tg&&tg.platform&&tg.platform!=="unknown");
if(tg){try{tg.ready();tg.expand();}catch(e){}}
const $=id=>document.getElementById(id),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e;};
function hashParam(n){const h=(location.hash||"").replace(/^#/,"");for(const p of h.split(/[&?]/)){const i=p.indexOf("=");if(i>0&&p.slice(0,i)===n)return p.slice(i+1);}return null;}
function b64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function decode(d){if(typeof DecompressionStream==="undefined")throw new Error("this Telegram version can't open it. Update Telegram.");
  return JSON.parse(await new Response(new Blob([b64u(d)]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text());}
function demo(){return{v:3,title:"Today",label:"DEMO",gap:5,moves:[{id:"a",tier:1,n:"March in place",t:20,how:"Easy march, arms swinging."},
  {id:"b",tier:1,n:"Arm circles",t:20,how:"Small circles, then big."},{id:"c",tier:2,n:"Calf raises",t:20,sides:true,how:"One leg at a time. Switch at the beep."}],
  pts:[{id:"ex",n:"PT exercises",unit:"set",goal:[["1 set · min",1],["2 · goal",2]],items:[{n:"Shoulder rolls",pre:5,t:15,how:"10 slow rolls."},{n:"Neck stretch",pre:5,t:10,reps:2,sides:true,how:"Ear to shoulder."}]}],
  tabs:[{id:"am",n:"Morning",from:4,blocks:[{type:"mood"},{type:"moves"},{type:"pt",m:"ex"},{type:"list",key:"am",n:"Morning",groups:[{g:"Start",items:["Drink water",{n:"Stretch",opt:true}]},{g:"Body",items:[{n:"Warm-up",id:"warmup"}]}]}]},
    {id:"pm",n:"Evening",from:18,blocks:[{type:"pt",m:"ex"},{type:"list",key:"pm",n:"Evening",items:["Tidy desk","Lights low"]}]}]};}
const pad=n=>String(n).padStart(2,"0"),mmss=s=>Math.floor(s/60)+":"+pad(s%60);
const dayOf=t=>{const d=new Date(t.getTime()-4*3600e3);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};   // the day runs 4 am → 4 am
const DAY=dayOf(new Date()),HR=new Date().getHours();
const nm=x=>typeof x==="string"?x:x.n,isOpt=x=>typeof x==="object"&&!!x.opt;
let C,S,R,M,CORE,tab,phase="ready",left=0,tick=null,cur=null,party=0,FL=false;const OPEN={},PP={};
// S = the day {d, mv:{id:1}, t:{listkey:{itemkey:1}}, mood, order:[ids]}; R = rotation across days {next (index into the daily set), sets}.
const K=()=>(C.to||"x"),cs=()=>inTg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")?tg.CloudStorage:null;
function cget(k){return new Promise(res=>{let loc=null;try{loc=JSON.parse(localStorage.getItem(k));}catch(e){}const c=cs();if(!c)return res([loc,null]);
  let done=false;try{c.getItem(k,(err,v)=>{if(done)return;done=true;let r=null;try{r=v?JSON.parse(v):null;}catch(e){}res([loc,r]);});}catch(e){done=true;res([loc,null]);}
  setTimeout(()=>{if(!done){done=true;res([loc,null]);}},1500);});}
function cput(k,o){const v=JSON.stringify(o);try{localStorage.setItem(k,v);}catch(e){}const c=cs();if(c)try{c.setItem(k,v);}catch(e){}}
function merge(a,b){if(!a)return b;if(!b)return a;const o=Object.assign({},a,b);for(const k of Object.keys(o))if(a[k]&&b[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))o[k]=merge(a[k],b[k]);return o;}
const save=()=>cput("day_"+K(),S),saveR=()=>cput("rot_"+K(),R);
function haptic(k){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(k||"light");}catch(e){}}
let AC=null;   // iOS: "playback" lets beeps sound with the ringer switch on silent; a suspended/interrupted context is resumed on every beep and tap
try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}
document.addEventListener("pointerdown",()=>{try{if(AC&&AC.state!=="running")AC.resume();}catch(e){}},true);
function beep(f,ms){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume();const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=f||880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.5,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(ms||250)/1000);
  o.start();o.stop(AC.currentTime+(ms||250)/1000);}catch(e){}}
function beeps(n){for(let k=0;k<n;k++)setTimeout(()=>beep(n>2?784:988,110),k*170);}   // 2 = end of a rep or switch sides, 3 = this one is done, next one up
const byId=id=>M.find(m=>m.id===id),done=()=>M.filter(m=>S.mv[m.id]).length;
function level(){const d=done();return d===0?0:CORE.every(m=>S.mv[m.id])?(M.every(m=>S.mv[m.id])?3:2):1;}
function nextId(){return(S.order||[]).find(id=>!S.mv[id]&&byId(id));}
const T=()=>C.tabs.find(t=>t.id===tab);
function tabs(){const b=$("tabs");b.innerHTML="";for(const t of C.tabs){const x=el("button",t.id===tab?"on":"",t.n);
  x.onclick=()=>{if(phase==="go"||phase==="gap")stop();tab=t.id;render();};b.appendChild(x);}}
function dots(c){const d=el("div","dots");for(const id of S.order){const m=byId(id);if(!m)continue;
  d.appendChild(el("div","dot"+(m.tier===2?" x":"")+(S.mv[id]?" on":"")+((phase==="go"||phase==="gap")&&id===cur?" cur":"")));}c.appendChild(d);}
function run(){clearInterval(tick);tick=setInterval(()=>{left--;const m=byId(cur);
  if(phase==="go"&&m.sides&&left===Math.floor(m.t/2)){beeps(2);haptic("medium");}
  if(left<=0){clearInterval(tick);if(phase==="go")finishMove();else{phase="go";left=byId(cur).t;beep(880,200);run();}}render();},1000);}
function go(id){cur=id;phase="go";left=byId(id).t;beep(880,200);haptic();run();render();}
function start(){beep(1,1);const id=nextId();if(id)go(id);}
function finishMove(){const m=byId(cur),before=level();S.mv[m.id]=1;
  const ci=CORE.indexOf(m);if(ci>=0)R.next=(ci+1)%CORE.length;
  const now=level();if(now===3&&before<3)R.sets=(R.sets||0)+1;save();saveR();
  if(now>before&&now>=2){phase="party";party=now;beep(988,350);setTimeout(()=>beep(1319,500),300);
    try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred("success");}catch(e){}render();return;}
  const id=nextId();if(!id){phase="ready";render();return;}
  beeps(3);haptic("heavy");cur=id;phase="gap";left=C.gap||8;run();}
function stop(){clearInterval(tick);phase="ready";render();}
function skip(){clearInterval(tick);const i=S.order.indexOf(cur);const rest=S.order.slice(i+1).concat(S.order.slice(0,i)).find(id=>!S.mv[id]);if(rest)go(rest);else stop();}
function moodB(m){const f=el("div","card");f.appendChild(el("div","","How do you feel?"));const r=el("div","mood");
  for(let i=1;i<=5;i++){const b=el("button",S.mood===i?"on":"",String(i));b.onclick=()=>{S.mood=S.mood===i?null:i;save();haptic();render();};r.appendChild(b);}
  f.appendChild(r);m.appendChild(f);}
function movesB(m){const c=el("div","card"),lv=level(),nc=CORE.filter(x=>S.mv[x.id]).length,nx=M.length-CORE.length;
  if(phase==="party"){c.className="card party";
    if(party===3){c.appendChild(el("div","em","🏆"));c.appendChild(el("div","big","All "+M.length+"! Amazing."));c.appendChild(el("div","mu","Daily set plus every extra. That's the whole thing."));}
    else{c.appendChild(el("div","em","🎉"));c.appendChild(el("div","big","Great job! Daily set done."));c.appendChild(el("div","mu","All "+CORE.length+" done. Feeling good? "+nx+" extras are next."));
      const k=el("button","btn","▶ Keep going: "+nx+" extras");k.onclick=()=>{const id=nextId();if(id)go(id);};c.appendChild(k);}
    const b=el("button","btn alt","Done for now");b.onclick=()=>{phase="ready";render();};c.appendChild(b);}
  else if(phase==="ready"){const id=nextId(),x=id&&byId(id);c.appendChild(el("div","gh","Warm-up"));
    if(!x){c.appendChild(el("div","big","All "+M.length+" done today 🏆"));dots(c);}
    else{c.appendChild(el("div","mu",x.tier===2?"Extra · next up":"Next up"));c.appendChild(el("div","big",x.n));dots(c);
      c.appendChild(el("div","mu",lv>=2?"Daily set done. Extras are a bonus; stop any time.":"Runs on its own; stop any time. Daily set: "+nc+" of "+CORE.length+"."));
      const b=el("button","btn","▶ Start");b.onclick=start;c.appendChild(b);}
    const L=el("div","lv");[["1+ move",1],["Daily set",2],["All "+M.length,3]].forEach(([t,v])=>L.appendChild(el("span",lv>=v?"on":"",(lv>=v?"✓ ":"")+t)));c.appendChild(L);}
  else{const x=byId(cur);
    c.appendChild(el("div","mu",phase==="gap"?"Next up":(x.tier===2?"Extra":"Daily set")+" · "+(S.order.indexOf(cur)+1)+" of "+S.order.length));c.appendChild(el("div","big",x.n));dots(c);
    c.appendChild(el("div","timer",mmss(Math.max(left,0))));
    c.appendChild(el("div","side",phase==="gap"?"Get ready":x.sides?(left>Math.floor(x.t/2)?"First side":"Other side"):""));
    c.appendChild(el("div","how",x.how));
    const r2=el("div","row2"),st=el("button","btn alt","■ Stop"),sk=el("button","btn alt","Skip ›");st.onclick=stop;sk.onclick=skip;
    r2.appendChild(st);r2.appendChild(sk);c.appendChild(r2);}
  m.appendChild(c);}
function row(parent,x,st,key,upd){const r=el("div","it"+(st[key]?" on":""));r.appendChild(el("div","box",st[key]?"✓":""));
  const s=el("span","",nm(x));if(isOpt(x))s.appendChild(el("span","opt"," · optional"));r.appendChild(s);
  r.onclick=()=>{if(st[key])delete st[key];else st[key]=1;r.classList.toggle("on");r.firstChild.textContent=st[key]?"✓":"";upd();save();haptic();render();};parent.appendChild(r);}
const pairs=L=>L.groups?L.groups.flatMap((g,gi)=>g.items.map((x,i)=>[x,gi+"."+i])):L.items.map((x,i)=>[x,String(i)]);
function count(L,st){const req=pairs(L).filter(([x])=>!isOpt(x));return[req.filter(([,k])=>st[k]).length,req.length];}
// PT modules: state per module p in S[k+"n"] (items done today), S[k+"k"] (item count it was counted against), R[k+"pos"] (next item); k = "pt" for exercises (v4 keys), else p.id.
const PM=id=>(C.pts||[]).find(p=>p.id===id),PK=p=>p.id==="ex"?"pt":p.id,pN=p=>p.items.length,pst=p=>PP[p.id]=PP[p.id]||{ph:"ready",left:0,tick:null};
const pDone=p=>Math.floor((S[PK(p)+"n"]||0)/pN(p)),pIn=p=>(S[PK(p)+"n"]||0)%pN(p);
function pFix(p){const k=PK(p);if(S[k+"k"]!==pN(p)){S[k+"n"]=0;S[k+"k"]=pN(p);}}   // the item list changed: today's count restarts
function listB(m,L,key,open,extra){const d=el("details");d.open=key in OPEN?OPEN[key]:!!open;d.addEventListener("toggle",()=>{OPEN[key]=d.open;});const s=el("summary");s.appendChild(el("span","",L.n+(L.opt?" · optional":"")));
  const cnt=el("span","cnt");s.appendChild(cnt);d.appendChild(s);if(L.sub)d.appendChild(el("div","mu",L.sub));if(extra)extra(d);
  const st=S.t[key]=S.t[key]||{};
  if(L.groups&&level()>=1)pairs(L).forEach(([x,k])=>{if(x.id==="warmup")st[k]=1;});
  const upd=()=>{const[a,b]=count(L,st);cnt.textContent=a+"/"+b;};
  if(L.groups)L.groups.forEach((g,gi)=>{d.appendChild(el("div","gh",g.g));g.items.forEach((x,i)=>row(d,x,st,gi+"."+i,upd));});
  else L.items.forEach((x,i)=>row(d,x,st,String(i),upd));
  upd();m.appendChild(d);}
function flip(c,x){if(!x.img||x.img.length<2)return;const f=el("div","flip"+(FL?" on":""));
  x.img.forEach((u,i)=>{const im=el("img",i?"b":"a");im.alt="";im.src=u;im.onerror=()=>f.remove();f.appendChild(im);});c.appendChild(f);}
setInterval(()=>{FL=!FL;document.querySelectorAll(".flip").forEach(f=>f.classList.toggle("on",FL));},1200);
function tickList(id){for(const t of C.tabs)for(const b of t.blocks)if(b.type==="list"){const st=S.t[b.key]=S.t[b.key]||{};for(const[x,k]of pairs(b))if(x.id===id)st[k]=1;}}
// A PT run = the whole module as one timed sequence of steps {i: item index, k: "pre" | "go" | "gap", d: seconds, lab}; timed off the wall clock so a locked phone catches up. Run buttons: ⏸/▶ pause-resume, ■ stop (counts nothing), ✓ done with this item (jump to the next); "＋ Log" at the top counts a full set done without the card.
function pSteps(p){const out=[];p.items.forEach((x,i)=>{const sides=x.sides?["Left side","Right side"]:[""],reps=x.reps||1,sets=x.sets||1;
  if(x.pre)out.push({i,k:"pre",d:x.pre,lab:"Get ready"});
  for(let q=1;q<=sets;q++)for(let r=1;r<=reps;r++)sides.forEach((sd,j)=>{
    if(out.length&&out[out.length-1].i===i&&out[out.length-1].k==="go")out.push(r===1&&j===0&&q>1?{i,k:"gap",d:(x.gap||5)+5,lab:"Round "+q+": start low again"}:{i,k:"gap",d:x.gap||5,lab:x.sides?"Switch sides":x.rl?"Move up to the next spot":"Reset"});
    const lab=[sd,reps>1?(x.rl?x.rl+" ":"")+r+" of "+reps:"",sets>1?"round "+q+" of "+sets:""].filter(Boolean).join(" · ");
    out.push({i,k:"go",d:x.t||30,lab:x.sides?lab:reps>1?"Hold · "+lab:"Go"});});});return out;}
const pTot=st=>st.reduce((a,x)=>a+x.d,0);
let WL=null;async function wake(on){try{if(on&&navigator.wakeLock&&!WL)WL=await navigator.wakeLock.request("screen");else if(!on&&WL){WL.release();WL=null;}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Object.values(PP).some(s=>s.ph==="go")){WL=null;wake(1);}});
function ptGo(p){const s=pst(p);clearInterval(s.tick);Object.assign(s,{ph:"go",steps:pSteps(p),t0:Date.now(),off:0,idx:-1,pz:0});beep(1,1);wake(1);s.tick=setInterval(()=>ptTick(p),250);ptTick(p);}
function ptTick(p){const s=pst(p),e=(Date.now()-s.t0)/1000+s.off;let a=0,i=0;for(;i<s.steps.length;i++){if(e<a+s.steps[i].d)break;a+=s.steps[i].d;}
  if(i>=s.steps.length){ptFinish(p);return;}
  const tot=pTot(s.steps);s.rem=Math.ceil(a+s.steps[i].d-e);s.totRem=Math.ceil(tot-e);
  if(i!==s.idx){const pv=s.steps[s.idx];s.idx=i;s.last=s.rem;
    if(s.steps[i].k==="go"){if(pv&&pv.k==="go"&&pv.i!==s.steps[i].i){beeps(3);setTimeout(()=>beep(880,220),600);}else beep(880,220);haptic("heavy");}else if(pv&&pv.k==="go"){beeps(pv.i===s.steps[i].i?2:3);haptic("medium");}else{beep(523,300);haptic("medium");}render();return;}

<script id="st-script">
(function () {

  var text = (target && target.textContent.trim()) || document.title || "";
